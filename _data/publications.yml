# Fields
#   title, authors (list, as printed on the paper), venue, year  — required
#   short   — label shown in the thumbnail slot when there is no image
#   tag     — small venue label under `short` in that slot
#   image   — file in assets/img/pubs/ (4:3 works best; 800x600 JPEG)
